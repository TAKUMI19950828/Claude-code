<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NISA資産形成シミュレーター</title>
<style>
:root {
  --color-bg: #f4f6ff;
  --color-primary: #6c8cff;
  --color-primary-dark: #4a68e0;
  --color-accent: #ff7eb6;
  --color-text: #2c2c3a;
  --color-card: #ffffff;
  --radius-lg: 20px;
  --radius-md: 14px;
  --shadow-soft: 0 8px 24px rgba(76, 92, 200, 0.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, #eef1ff 0%, #fdf2f8 100%);
  color: var(--color-text);
}
.page { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 8px; color: var(--color-primary-dark); }
.header p { margin: 0; color: #6b6b80; font-size: 0.95rem; }
.layout { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--color-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 20px; }
.card h2 { margin: 0 0 16px; font-size: 1.1rem; color: var(--color-primary-dark); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 0.85rem; font-weight: 600; color: #555; }
.field input[type="number"] {
  border: 2px solid #e3e6fb; border-radius: var(--radius-md); padding: 10px 12px;
  font-size: 1rem; background: #fbfcff; color: var(--color-text); transition: border-color .15s ease; width: 100%;
}
.field input[type="number"]:focus { outline: none; border-color: var(--color-primary); }
.field input[type="range"] { accent-color: var(--color-primary); width: 100%; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 18px 10px; }
.stat-label { font-size: 0.8rem; font-weight: 700; color: #888; }
.stat-value { font-size: clamp(1rem, 3.5vw, 1.4rem); font-weight: 800; }
.stat-principal { background: linear-gradient(135deg, #eef1ff, #ffffff); }
.stat-principal .stat-value { color: var(--color-primary-dark); }
.stat-profit { background: linear-gradient(135deg, #ffeef6, #ffffff); }
.stat-profit .stat-value { color: #e0568f; }
.stat-final { background: linear-gradient(135deg, #fff8e6, #ffffff); }
.stat-final .stat-value { color: #c98a00; }
.chart-wrapper { width: 100%; overflow-x: auto; }
svg.chart { display: block; width: 100%; height: 320px; }
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-principal { background: var(--color-primary); }
.dot-profit { background: var(--color-accent); }
.footer { text-align: center; margin-top: 28px; color: #9a9aac; font-size: 0.75rem; }
@media (max-width: 640px) { .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <h1>🌱 NISA資産形成シミュレーター</h1>
    <p>毎月の積立で、将来どれくらい資産が育つか試してみよう</p>
  </header>

  <main class="layout">
    <section class="card input-card">
      <h2>入力条件</h2>

      <div class="field">
        <label for="initial">初期資産（円）</label>
        <input id="initial" type="number" min="0" step="10000" value="100000" />
      </div>

      <div class="field">
        <label for="monthly">毎月積立額（円）</label>
        <input id="monthly" type="number" min="0" step="1000" value="30000" />
      </div>

      <div class="field">
        <label for="rate">想定年利（%）</label>
        <input id="rate" type="number" min="0" max="30" step="0.1" value="5" />
        <input id="rateRange" type="range" min="0" max="15" step="0.1" value="5" />
      </div>

      <div class="field">
        <label for="years">運用年数（年）</label>
        <input id="years" type="number" min="1" max="60" step="1" value="20" />
        <input id="yearsRange" type="range" min="1" max="50" step="1" value="20" />
      </div>
    </section>

    <section class="results">
      <div class="card stat-card stat-principal">
        <span class="stat-label">元本</span>
        <span class="stat-value" id="statPrincipal">-</span>
      </div>
      <div class="card stat-card stat-profit">
        <span class="stat-label">運用益</span>
        <span class="stat-value" id="statProfit">-</span>
      </div>
      <div class="card stat-card stat-final">
        <span class="stat-label">最終資産額</span>
        <span class="stat-value" id="statFinal">-</span>
      </div>
    </section>

    <section class="card chart-card">
      <h2>資産の推移</h2>
      <div class="chart-wrapper">
        <svg class="chart" id="chart" viewBox="0 0 800 320" preserveAspectRatio="none"></svg>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot dot-principal"></span> 元本</span>
        <span class="legend-item"><span class="legend-dot dot-profit"></span> 運用益</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>※ このシミュレーションは年利が毎年一定であると仮定した簡易計算であり、実際の運用成果を保証するものではありません。</p>
  </footer>
</div>

<script>
function simulate(initialAmount, monthlyAmount, annualRatePercent, years) {
  const monthlyRate = annualRatePercent / 100 / 12;
  const yearly = [];
  let balance = initialAmount;
  let principal = initialAmount;
  yearly.push({ year: 0, principal, balance, profit: balance - principal });
  for (let year = 1; year <= years; year++) {
    for (let month = 0; month < 12; month++) {
      balance = balance * (1 + monthlyRate) + monthlyAmount;
      principal += monthlyAmount;
    }
    yearly.push({ year, principal, balance, profit: balance - principal });
  }
  return {
    yearly,
    totalPrincipal: principal,
    totalProfit: balance - principal,
    finalBalance: balance,
  };
}

function formatYen(value) {
  return Math.round(value).toLocaleString("ja-JP") + "円";
}

function formatYenShort(value) {
  if (value >= 10000) return (value / 10000).toFixed(0) + "万円";
  return Math.round(value).toLocaleString("ja-JP") + "円";
}

const els = {
  initial: document.getElementById("initial"),
  monthly: document.getElementById("monthly"),
  rate: document.getElementById("rate"),
  rateRange: document.getElementById("rateRange"),
  years: document.getElementById("years"),
  yearsRange: document.getElementById("yearsRange"),
  statPrincipal: document.getElementById("statPrincipal"),
  statProfit: document.getElementById("statProfit"),
  statFinal: document.getElementById("statFinal"),
  chart: document.getElementById("chart"),
};

function drawChart(yearly) {
  const W = 800, H = 320;
  const padding = { top: 16, right: 12, bottom: 28, left: 64 };
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;

  const maxBalance = Math.max(...yearly.map((y) => y.balance), 1);
  const n = yearly.length;
  const stepX = innerW / Math.max(n - 1, 1);

  function xAt(i) { return padding.left + i * stepX; }
  function yAt(v) { return padding.top + innerH * (1 - v / maxBalance); }

  function buildArea(getTop, getBottom) {
    let d = "M " + xAt(0) + " " + yAt(getBottom(0));
    for (let i = 0; i < n; i++) d += " L " + xAt(i) + " " + yAt(getTop(i));
    for (let i = n - 1; i >= 0; i--) d += " L " + xAt(i) + " " + yAt(getBottom(i));
    d += " Z";
    return d;
  }

  const principalArea = buildArea((i) => yearly[i].principal, () => 0);
  const balanceArea = buildArea((i) => yearly[i].balance, (i) => yearly[i].principal);

  const gridLines = 4;
  let gridSvg = "";
  for (let g = 0; g <= gridLines; g++) {
    const v = (maxBalance / gridLines) * g;
    const y = yAt(v);
    gridSvg += `<line x1="${padding.left}" y1="${y}" x2="${W - padding.right}" y2="${y}" stroke="#eef0fa" stroke-width="1" />`;
    gridSvg += `<text x="${padding.left - 8}" y="${y + 4}" font-size="11" fill="#888" text-anchor="end">${formatYenShort(v)}</text>`;
  }

  const labelStep = Math.max(1, Math.ceil(n / 8));
  let xLabels = "";
  for (let i = 0; i < n; i += labelStep) {
    xLabels += `<text x="${xAt(i)}" y="${H - padding.bottom + 18}" font-size="11" fill="#888" text-anchor="middle">${yearly[i].year}年</text>`;
  }

  els.chart.innerHTML = `
    <defs>
      <linearGradient id="principalColor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="5%" stop-color="#6c8cff" stop-opacity="0.8" />
        <stop offset="95%" stop-color="#6c8cff" stop-opacity="0.1" />
      </linearGradient>
      <linearGradient id="profitColor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="5%" stop-color="#ff7eb6" stop-opacity="0.85" />
        <stop offset="95%" stop-color="#ff7eb6" stop-opacity="0.15" />
      </linearGradient>
    </defs>
    ${gridSvg}
    <path d="${principalArea}" fill="url(#principalColor)" stroke="#6c8cff" stroke-width="2" />
    <path d="${balanceArea}" fill="url(#profitColor)" stroke="#ff7eb6" stroke-width="2" />
    ${xLabels}
  `;
}

function update() {
  const initialAmount = Number(els.initial.value) || 0;
  const monthlyAmount = Number(els.monthly.value) || 0;
  const annualRate = Number(els.rate.value) || 0;
  const years = Math.max(1, Number(els.years.value) || 1);

  const result = simulate(initialAmount, monthlyAmount, annualRate, years);

  els.statPrincipal.textContent = formatYen(result.totalPrincipal);
  els.statProfit.textContent = formatYen(result.totalProfit);
  els.statFinal.textContent = formatYen(result.finalBalance);

  drawChart(result.yearly);
}

els.initial.addEventListener("input", update);
els.monthly.addEventListener("input", update);
els.rate.addEventListener("input", () => { els.rateRange.value = els.rate.value; update(); });
els.rateRange.addEventListener("input", () => { els.rate.value = els.rateRange.value; update(); });
els.years.addEventListener("input", () => { els.yearsRange.value = els.years.value; update(); });
els.yearsRange.addEventListener("input", () => { els.years.value = els.yearsRange.value; update(); });

update();
window.addEventListener("resize", () => update());
</script>
</body>
</html>
