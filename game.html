<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マジカル☆シューター - 魔法少女シューティング</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0d0221;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    max-width: 100vw;
    max-height: 100vh;
    display: block;
    box-shadow: 0 0 40px rgba(255, 105, 180, 0.35);
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- 状態 ----------
const STATE = { TITLE: 0, PLAY: 1, GAMEOVER: 2 };
let state = STATE.TITLE;
let frame = 0;
let score = 0;
let hiScore = Number(localStorage.getItem("mgShooterHi") || 0);
let wave = 1;

const keys = {};
addEventListener("keydown", e => {
  keys[e.key] = true;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if (e.key === " " || e.key === "Enter") handleStart();
});
addEventListener("keyup", e => keys[e.key] = false);

// タッチ操作（ドラッグで移動、自動射撃）
let touchPos = null;
function toCanvas(t) {
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
canvas.addEventListener("touchstart", e => { e.preventDefault(); touchPos = toCanvas(e.touches[0]); handleStart(); }, { passive: false });
canvas.addEventListener("touchmove", e => { e.preventDefault(); touchPos = toCanvas(e.touches[0]); }, { passive: false });
canvas.addEventListener("touchend", () => touchPos = null);
canvas.addEventListener("mousedown", () => handleStart());

function handleStart() {
  if (state === STATE.TITLE) startGame();
  else if (state === STATE.GAMEOVER && gameOverTimer > 60) { state = STATE.TITLE; }
}

// ---------- エンティティ ----------
const player = { x: W / 2, y: H - 90, r: 6, speed: 5, lives: 3, inv: 0, power: 1 };
let bullets = [];   // 自弾
let ebullets = [];  // 敵弾
let enemies = [];
let particles = [];
let items = [];
let stars = [];
let gameOverTimer = 0;
let boss = null;

for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, v: Math.random() * 1.5 + 0.3 });
}

function startGame() {
  state = STATE.PLAY;
  score = 0; wave = 1; frame = 0;
  player.x = W / 2; player.y = H - 90;
  player.lives = 3; player.inv = 120; player.power = 1;
  bullets = []; ebullets = []; enemies = []; particles = []; items = [];
  boss = null;
}

// ---------- 生成 ----------
function spawnEnemies() {
  if (boss) return;
  const rate = Math.max(20, 60 - wave * 4);
  if (frame % rate === 0) {
    const type = Math.random();
    const x = 40 + Math.random() * (W - 80);
    if (type < 0.55) {
      // コウモリ型: ふらふら降下
      enemies.push({ kind: "bat", x, y: -20, hp: 2, r: 14, t: 0, vy: 1.5 + wave * 0.1, amp: 60 + Math.random() * 40, score: 100 });
    } else if (type < 0.85) {
      // ゴースト型: 停止して狙い撃ち
      enemies.push({ kind: "ghost", x, y: -20, hp: 4, r: 16, t: 0, stopY: 100 + Math.random() * 150, score: 200 });
    } else {
      // クリスタル型: 硬い、全方位弾
      enemies.push({ kind: "crystal", x, y: -24, hp: 8, r: 18, t: 0, vy: 0.8, score: 400 });
    }
  }
  // ウェーブ進行 & ボス
  if (frame > 0 && frame % 1800 === 0) {
    boss = { kind: "boss", x: W / 2, y: -60, hp: 60 + wave * 30, maxHp: 60 + wave * 30, r: 44, t: 0, score: 3000 * wave };
  }
}

function burst(x, y, color, n = 14, spd = 3.5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd + 0.5;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 20, color, size: Math.random() * 3 + 1 });
  }
}

function aimAt(sx, sy, tx, ty, speed) {
  const a = Math.atan2(ty - sy, tx - sx);
  return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
}

// ---------- 更新 ----------
function update() {
  frame++;
  for (const s of stars) { s.y += s.v; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (state !== STATE.PLAY) { if (state === STATE.GAMEOVER) gameOverTimer++; return; }

  // プレイヤー移動
  const slow = keys["Shift"] ? 0.45 : 1;
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"] || keys["a"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"]) dx += 1;
  if (keys["ArrowUp"] || keys["w"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"]) dy += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x += dx * player.speed * slow;
  player.y += dy * player.speed * slow;
  if (touchPos) {
    player.x += (touchPos.x - player.x) * 0.3;
    player.y += (touchPos.y - 60 - player.y) * 0.3;
  }
  player.x = Math.max(15, Math.min(W - 15, player.x));
  player.y = Math.max(15, Math.min(H - 15, player.y));
  if (player.inv > 0) player.inv--;

  // 自動射撃（スターの魔法弾）
  if (frame % 6 === 0) {
    bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -11 });
    if (player.power >= 2) {
      bullets.push({ x: player.x - 12, y: player.y - 6, vx: -1, vy: -10.5 });
      bullets.push({ x: player.x + 12, y: player.y - 6, vx: 1, vy: -10.5 });
    }
    if (player.power >= 3) {
      bullets.push({ x: player.x - 20, y: player.y, vx: -2.5, vy: -10 });
      bullets.push({ x: player.x + 20, y: player.y, vx: 2.5, vy: -10 });
    }
  }
  bullets = bullets.filter(b => (b.x += b.vx, b.y += b.vy, b.y > -20 && b.x > -20 && b.x < W + 20));

  spawnEnemies();

  // 敵更新
  for (const e of enemies) {
    e.t++;
    if (e.kind === "bat") {
      e.y += e.vy;
      e.x += Math.sin(e.t * 0.05) * 2;
      if (e.t % 90 === 45 && e.y > 0 && e.y < H - 200) {
        const v = aimAt(e.x, e.y, player.x, player.y, 3 + wave * 0.15);
        ebullets.push({ x: e.x, y: e.y, ...v, r: 5, color: "#ff6ec7" });
      }
    } else if (e.kind === "ghost") {
      if (e.y < e.stopY) e.y += 2; else if (e.t % 70 === 0) {
        for (let i = -1; i <= 1; i++) {
          const a = Math.atan2(player.y - e.y, player.x - e.x) + i * 0.25;
          const sp = 3.2 + wave * 0.15;
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5, color: "#9d6eff" });
        }
      }
      if (e.t > 400) e.y += 1.5;
    } else if (e.kind === "crystal") {
      e.y += e.vy;
      if (e.t % 100 === 50) {
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + e.t * 0.01;
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5, r: 5, color: "#5ee0ff" });
        }
      }
    }
  }
  enemies = enemies.filter(e => e.y < H + 40 && e.hp > 0);

  // ボス更新
  if (boss) {
    boss.t++;
    if (boss.y < 110) boss.y += 1.2;
    else {
      boss.x = W / 2 + Math.sin(boss.t * 0.02) * (W / 2 - 80);
      if (boss.t % 50 === 0) {
        const n = 12 + wave * 2;
        for (let i = 0; i < n; i++) {
          const a = i * Math.PI * 2 / n + boss.t * 0.03;
          ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 2.8, vy: Math.sin(a) * 2.8, r: 6, color: "#ff4d6d" });
        }
      }
      if (boss.t % 35 === 17) {
        const v = aimAt(boss.x, boss.y, player.x, player.y, 4.5);
        ebullets.push({ x: boss.x, y: boss.y, ...v, r: 7, color: "#ffd166" });
      }
    }
  }

  // 敵弾更新
  ebullets = ebullets.filter(b => (b.x += b.vx, b.y += b.vy, b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30));

  // アイテム
  for (const it of items) { it.y += 2; it.x += Math.sin(it.y * 0.05) * 1.2; }
  items = items.filter(it => {
    if (Math.hypot(it.x - player.x, it.y - player.y) < 22) {
      if (it.kind === "P") { player.power = Math.min(3, player.power + 1); score += 500; }
      else { player.lives = Math.min(5, player.lives + 1); }
      burst(it.x, it.y, "#ffe066", 10, 2);
      return false;
    }
    return it.y < H + 20;
  });

  // 当たり判定: 自弾 → 敵
  for (const b of bullets) {
    for (const e of enemies) {
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
        e.hp--; b.y = -999;
        particles.push({ x: b.x, y: b.y0 || e.y + e.r, vx: 0, vy: -1, life: 10, color: "#fff", size: 2 });
        if (e.hp <= 0) {
          score += e.score;
          burst(e.x, e.y, e.kind === "crystal" ? "#5ee0ff" : "#ff6ec7");
          if (Math.random() < (e.kind === "crystal" ? 0.5 : 0.12)) {
            items.push({ x: e.x, y: e.y, kind: Math.random() < 0.85 ? "P" : "L" });
          }
        }
      }
    }
    if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r + 5) {
      boss.hp--; b.y = -999;
      if (boss.hp <= 0) {
        score += boss.score;
        burst(boss.x, boss.y, "#ffd166", 60, 6);
        burst(boss.x, boss.y, "#ff6ec7", 40, 4);
        items.push({ x: boss.x, y: boss.y, kind: "L" });
        boss = null;
        wave++;
        ebullets = []; // ボス撃破ボーナス: 弾消し
      }
    }
  }
  bullets = bullets.filter(b => b.y > -100);

  // 当たり判定: 敵弾・敵 → プレイヤー
  if (player.inv <= 0) {
    let hit = false;
    for (const b of ebullets) if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r) { hit = true; b.y = 9999; break; }
    if (!hit) for (const e of enemies) if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) { hit = true; break; }
    if (!hit && boss && Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r) hit = true;
    if (hit) {
      player.lives--;
      player.inv = 120;
      player.power = Math.max(1, player.power - 1);
      burst(player.x, player.y, "#fff", 24, 5);
      ebullets = ebullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 120); // 救済弾消し
      if (player.lives <= 0) {
        state = STATE.GAMEOVER;
        gameOverTimer = 0;
        if (score > hiScore) { hiScore = score; localStorage.setItem("mgShooterHi", hiScore); }
      }
    }
  }

  // パーティクル
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

// ---------- 描画 ----------
function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(frame / 4) % 2 === 0) return;
  const { x, y } = player;
  ctx.save();
  // スカート
  ctx.fillStyle = "#ff6ec7";
  ctx.beginPath();
  ctx.moveTo(x, y - 4);
  ctx.lineTo(x - 11, y + 12);
  ctx.quadraticCurveTo(x, y + 17, x + 11, y + 12);
  ctx.closePath();
  ctx.fill();
  // 体
  ctx.fillStyle = "#fff";
  ctx.fillRect(x - 4, y - 8, 8, 8);
  // 顔
  ctx.fillStyle = "#ffe4d1";
  ctx.beginPath(); ctx.arc(x, y - 13, 6, 0, Math.PI * 2); ctx.fill();
  // 髪（ツインテール）
  ctx.fillStyle = "#b57aff";
  ctx.beginPath(); ctx.arc(x, y - 15, 6.5, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x - 9, y - 8, 3, 8, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 9, y - 8, 3, 8, -0.3, 0, Math.PI * 2); ctx.fill();
  // 杖の光
  drawStar(x, y - 26, 5 + Math.sin(frame * 0.2) * 1.5, "#ffe066");
  // 当たり判定表示（低速時）
  if (keys["Shift"]) {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(x, y, player.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  if (e.kind === "bat") {
    ctx.fillStyle = "#7b2d8b";
    const flap = Math.sin(e.t * 0.3) * 6;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x - 8, e.y); ctx.quadraticCurveTo(e.x - 20, e.y - 10 + flap, e.x - 24, e.y + 2); ctx.quadraticCurveTo(e.x - 16, e.y + 4, e.x - 8, e.y + 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + 8, e.y); ctx.quadraticCurveTo(e.x + 20, e.y - 10 + flap, e.x + 24, e.y + 2); ctx.quadraticCurveTo(e.x + 16, e.y + 4, e.x + 8, e.y + 3); ctx.fill();
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath(); ctx.arc(e.x - 3, e.y - 1, 1.8, 0, Math.PI * 2); ctx.arc(e.x + 3, e.y - 1, 1.8, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === "ghost") {
    ctx.fillStyle = "rgba(157,110,255,0.85)";
    ctx.beginPath();
    ctx.arc(e.x, e.y - 2, 13, Math.PI, 0);
    const w = Math.sin(e.t * 0.2) * 2;
    ctx.lineTo(e.x + 13, e.y + 10);
    for (let i = 3; i >= -3; i--) ctx.lineTo(e.x + i * 4.3, e.y + 10 + (i % 2 === 0 ? 4 + w : 0));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0d0221";
    ctx.beginPath(); ctx.arc(e.x - 5, e.y - 3, 2.5, 0, Math.PI * 2); ctx.arc(e.x + 5, e.y - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === "crystal") {
    ctx.translate(e.x, e.y); ctx.rotate(e.t * 0.03);
    ctx.fillStyle = "#5ee0ff";
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(12, 0); ctx.lineTo(0, 18); ctx.lineTo(-12, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(12, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  ctx.save();
  ctx.translate(b.x, b.y);
  // 魔女のシルエット
  ctx.fillStyle = "#3a0ca3";
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#560bad";
  ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(0, -70); ctx.lineTo(30, -20); ctx.closePath(); ctx.fill(); // 帽子
  ctx.fillStyle = "#ff4d6d";
  const g = Math.sin(b.t * 0.1) * 0.3 + 0.7;
  ctx.globalAlpha = g;
  ctx.beginPath(); ctx.arc(-14, -5, 6, 0, Math.PI * 2); ctx.arc(14, -5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 14, 12, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
  // HPバー
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(40, 14, W - 80, 8);
  ctx.fillStyle = "#ff4d6d";
  ctx.fillRect(40, 14, (W - 80) * b.hp / b.maxHp, 8);
}

function draw() {
  // 背景
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#0d0221");
  grad.addColorStop(0.6, "#1a0b3d");
  grad.addColorStop(1, "#2d1b5e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  for (const s of stars) { ctx.globalAlpha = 0.3 + s.s * 0.25; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if (state === STATE.TITLE) {
    drawTitle();
    return;
  }

  // 自弾
  for (const b of bullets) drawStar(b.x, b.y, 6, "rgba(255,224,102,0.95)");
  // 敵
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();
  // 敵弾
  for (const b of ebullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  // アイテム
  for (const it of items) {
    ctx.fillStyle = it.kind === "P" ? "#ffe066" : "#7bf1a8";
    ctx.beginPath(); ctx.arc(it.x, it.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a0b3d";
    ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(it.kind === "P" ? "P" : "♥", it.x, it.y + 1);
  }
  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawPlayer();

  // HUD
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("SCORE " + score, 10, 32);
  ctx.textAlign = "right";
  ctx.fillText("WAVE " + wave, W - 10, 32);
  for (let i = 0; i < player.lives; i++) {
    ctx.fillStyle = "#ff6ec7";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("♥", 10 + i * 18, 54);
  }

  if (state === STATE.GAMEOVER) {
    ctx.fillStyle = "rgba(13,2,33,0.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ff6ec7";
    ctx.font = "bold 42px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 50);
    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.fillText("SCORE: " + score, W / 2, H / 2 + 5);
    ctx.fillText("HI-SCORE: " + hiScore, W / 2, H / 2 + 35);
    if (gameOverTimer > 60) {
      ctx.font = "16px sans-serif";
      ctx.fillStyle = Math.floor(frame / 30) % 2 ? "#ffe066" : "#fff";
      ctx.fillText("スペースキー / タップでタイトルへ", W / 2, H / 2 + 90);
    }
  }
}

function drawTitle() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  drawStar(W / 2, H / 2 - 170, 40 + Math.sin(frame * 0.05) * 4, "rgba(255,224,102,0.9)");
  ctx.fillStyle = "#ff6ec7";
  ctx.font = "bold 44px sans-serif";
  ctx.fillText("マジカル☆", W / 2, H / 2 - 80);
  ctx.fillText("シューター", W / 2, H / 2 - 30);
  ctx.fillStyle = "#b57aff";
  ctx.font = "16px sans-serif";
  ctx.fillText("〜 魔法少女、星降る夜に舞う 〜", W / 2, H / 2 + 15);
  ctx.fillStyle = Math.floor(frame / 30) % 2 ? "#ffe066" : "#fff";
  ctx.font = "bold 20px sans-serif";
  ctx.fillText("スペースキー / タップ でスタート", W / 2, H / 2 + 80);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px sans-serif";
  ctx.fillText("移動: 矢印キー / WASD / ドラッグ", W / 2, H / 2 + 130);
  ctx.fillText("Shift: 低速移動（当たり判定表示）　射撃: 自動", W / 2, H / 2 + 152);
  ctx.fillText("HI-SCORE: " + hiScore, W / 2, H / 2 + 190);
}

// ---------- ループ ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
