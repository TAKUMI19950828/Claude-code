<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12082b">
<title>マジカル☆シューター - 魔法少女シューティング</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 100% at 50% 0%, #241150 0%, #12082b 55%, #0a0420 100%);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    max-width: 100vw;
    max-height: 100dvh;
    display: block;
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 24px 80px rgba(255, 82, 190, 0.28), 0 8px 32px rgba(94, 224, 255, 0.18);
  }
  @media (max-width: 500px) { canvas { border-radius: 0; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 480, H = 800;
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR;
canvas.height = H * DPR;
canvas.style.width = "min(100vw, calc(100dvh * " + (W / H) + "))";
ctx.scale(DPR, DPR);

// ---------- パレット ----------
const C = {
  pink:   "#ff52be",
  pinkHi: "#ff9ad8",
  purple: "#a06bff",
  cyan:   "#4de8ff",
  yellow: "#ffd94d",
  mint:   "#5dffb0",
  red:    "#ff5271",
  ink:    "#0a0420",
  white:  "#ffffff",
};

// ---------- 状態 ----------
const STATE = { TITLE: 0, PLAY: 1, GAMEOVER: 2 };
let state = STATE.TITLE;
let frame = 0;
let score = 0, dispScore = 0;
let hiScore = Number(localStorage.getItem("mgShooterHi") || 0);
let wave = 1;
let combo = 0, comboTimer = 0, maxCombo = 0;
let shake = 0;
let flash = 0;

const keys = {};
addEventListener("keydown", e => {
  keys[e.key] = true;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if (e.key === " " || e.key === "Enter") handleStart();
});
addEventListener("keyup", e => keys[e.key] = false);

let touchPos = null;
function toCanvas(t) {
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
canvas.addEventListener("touchstart", e => { e.preventDefault(); touchPos = toCanvas(e.touches[0]); handleStart(); }, { passive: false });
canvas.addEventListener("touchmove", e => { e.preventDefault(); touchPos = toCanvas(e.touches[0]); }, { passive: false });
canvas.addEventListener("touchend", () => touchPos = null);
canvas.addEventListener("mousedown", () => handleStart());

function handleStart() {
  if (state === STATE.TITLE) startGame();
  else if (state === STATE.GAMEOVER && gameOverTimer > 50) state = STATE.TITLE;
}

// ---------- エンティティ ----------
const player = { x: W / 2, y: H - 110, r: 6, speed: 5.4, lives: 3, inv: 0, power: 1, tilt: 0 };
let bullets = [], ebullets = [], enemies = [], particles = [], items = [], popups = [];
let stars = [], orbs = [];
let gameOverTimer = 0;
let boss = null;

for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, v: Math.random() * 1.6 + 0.3 });
for (let i = 0; i < 6; i++) orbs.push({ x: Math.random() * W, y: Math.random() * H, r: 60 + Math.random() * 120, hue: Math.random(), sp: 0.0004 + Math.random() * 0.0008, ph: Math.random() * 99 });

function startGame() {
  state = STATE.PLAY;
  score = 0; dispScore = 0; wave = 1; frame = 0;
  combo = 0; comboTimer = 0; maxCombo = 0; shake = 0; flash = 0;
  player.x = W / 2; player.y = H - 110;
  player.lives = 3; player.inv = 120; player.power = 1;
  bullets = []; ebullets = []; enemies = []; particles = []; items = []; popups = [];
  boss = null;
}

// ---------- 生成 ----------
function spawnEnemies() {
  if (boss) return;
  const rate = Math.max(20, 60 - wave * 4);
  if (frame % rate === 0) {
    const type = Math.random();
    const x = 40 + Math.random() * (W - 80);
    if (type < 0.55) {
      enemies.push({ kind: "bat", x, y: -20, hp: 2, r: 14, t: 0, vy: 1.5 + wave * 0.1, score: 100 });
    } else if (type < 0.85) {
      enemies.push({ kind: "ghost", x, y: -20, hp: 4, r: 16, t: 0, stopY: 110 + Math.random() * 170, score: 200 });
    } else {
      enemies.push({ kind: "crystal", x, y: -24, hp: 8, r: 18, t: 0, vy: 0.8, score: 400 });
    }
  }
  if (frame > 0 && frame % 1800 === 0) {
    boss = { x: W / 2, y: -70, hp: 60 + wave * 30, maxHp: 60 + wave * 30, r: 46, t: 0, score: 3000 * wave, dispHp: 1 };
  }
}

function burst(x, y, color, n = 14, spd = 3.5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd + 0.5;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 22, max: 50, color, size: Math.random() * 3.5 + 1.5, star: Math.random() < 0.3 });
  }
}

function popup(x, y, text, color, size = 16) {
  popups.push({ x, y, text, color, size, life: 45 });
}

function aimAt(sx, sy, tx, ty, speed) {
  const a = Math.atan2(ty - sy, tx - sx);
  return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
}

function addKill(e) {
  combo++;
  comboTimer = 120;
  maxCombo = Math.max(maxCombo, combo);
  const mult = 1 + Math.min(combo, 30) * 0.1;
  const pts = Math.round(e.score * mult);
  score += pts;
  popup(e.x, e.y - 10, "+" + pts, C.yellow, combo >= 5 ? 20 : 16);
  shake = Math.min(shake + 3, 8);
}

// ---------- 更新 ----------
function update() {
  frame++;
  dispScore += (score - dispScore) * 0.15;
  if (score - dispScore < 1) dispScore = score;
  for (const s of stars) { s.y += s.v; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (shake > 0) shake *= 0.85;
  if (flash > 0) flash -= 0.06;
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }
  if (state !== STATE.PLAY) { if (state === STATE.GAMEOVER) gameOverTimer++; return; }

  // プレイヤー移動
  const slow = keys["Shift"] ? 0.45 : 1;
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"] || keys["a"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"]) dx += 1;
  if (keys["ArrowUp"] || keys["w"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"]) dy += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  const px = player.x;
  player.x += dx * player.speed * slow;
  player.y += dy * player.speed * slow;
  if (touchPos) {
    player.x += (touchPos.x - player.x) * 0.3;
    player.y += (touchPos.y - 70 - player.y) * 0.3;
  }
  player.x = Math.max(16, Math.min(W - 16, player.x));
  player.y = Math.max(16, Math.min(H - 16, player.y));
  player.tilt += ((player.x - px) * 0.06 - player.tilt) * 0.2;
  if (player.inv > 0) player.inv--;

  // 自動射撃
  if (frame % 6 === 0) {
    bullets.push({ x: player.x, y: player.y - 16, vx: 0, vy: -12 });
    if (player.power >= 2) {
      bullets.push({ x: player.x - 13, y: player.y - 7, vx: -1, vy: -11.5 });
      bullets.push({ x: player.x + 13, y: player.y - 7, vx: 1, vy: -11.5 });
    }
    if (player.power >= 3) {
      bullets.push({ x: player.x - 21, y: player.y, vx: -2.5, vy: -11 });
      bullets.push({ x: player.x + 21, y: player.y, vx: 2.5, vy: -11 });
    }
    particles.push({ x: player.x, y: player.y + 14, vx: (Math.random() - 0.5), vy: 2.5, life: 14, max: 14, color: C.cyan, size: 2.5 });
  }
  bullets = bullets.filter(b => (b.x += b.vx, b.y += b.vy, b.y > -20 && b.x > -20 && b.x < W + 20));

  spawnEnemies();

  // 敵更新
  for (const e of enemies) {
    e.t++;
    if (e.kind === "bat") {
      e.y += e.vy;
      e.x += Math.sin(e.t * 0.05) * 2;
      if (e.t % 90 === 45 && e.y > 0 && e.y < H - 220) {
        const v = aimAt(e.x, e.y, player.x, player.y, 3 + wave * 0.15);
        ebullets.push({ x: e.x, y: e.y, ...v, r: 5, color: C.pink });
      }
    } else if (e.kind === "ghost") {
      if (e.y < e.stopY) e.y += 2; else if (e.t % 70 === 0) {
        for (let i = -1; i <= 1; i++) {
          const a = Math.atan2(player.y - e.y, player.x - e.x) + i * 0.25;
          const sp = 3.2 + wave * 0.15;
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5, color: C.purple });
        }
      }
      if (e.t > 400) e.y += 1.5;
    } else if (e.kind === "crystal") {
      e.y += e.vy;
      if (e.t % 100 === 50) {
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 + e.t * 0.01;
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5, r: 5, color: C.cyan });
        }
      }
    }
    if (e.flash > 0) e.flash--;
  }
  enemies = enemies.filter(e => e.y < H + 40 && e.hp > 0);

  // ボス更新
  if (boss) {
    boss.t++;
    boss.dispHp += (boss.hp / boss.maxHp - boss.dispHp) * 0.1;
    if (boss.flash > 0) boss.flash--;
    if (boss.y < 130) boss.y += 1.2;
    else {
      boss.x = W / 2 + Math.sin(boss.t * 0.02) * (W / 2 - 90);
      if (boss.t % 50 === 0) {
        const n = 12 + wave * 2;
        for (let i = 0; i < n; i++) {
          const a = i * Math.PI * 2 / n + boss.t * 0.03;
          ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 2.8, vy: Math.sin(a) * 2.8, r: 6, color: C.red });
        }
      }
      if (boss.t % 35 === 17) {
        const v = aimAt(boss.x, boss.y, player.x, player.y, 4.5);
        ebullets.push({ x: boss.x, y: boss.y, ...v, r: 7, color: C.yellow });
      }
    }
  }

  ebullets = ebullets.filter(b => (b.x += b.vx, b.y += b.vy, b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30));

  // アイテム
  for (const it of items) { it.y += 2; it.x += Math.sin(it.y * 0.05) * 1.2; it.t = (it.t || 0) + 1; }
  items = items.filter(it => {
    if (Math.hypot(it.x - player.x, it.y - player.y) < 26) {
      if (it.kind === "P") {
        player.power = Math.min(3, player.power + 1); score += 500;
        popup(it.x, it.y, player.power === 3 ? "MAX POWER!" : "POWER UP!", C.yellow, 18);
      } else {
        player.lives = Math.min(5, player.lives + 1);
        popup(it.x, it.y, "+1 LIFE", C.mint, 18);
      }
      burst(it.x, it.y, C.yellow, 12, 2.5);
      return false;
    }
    return it.y < H + 20;
  });

  // 当たり判定: 自弾 → 敵
  for (const b of bullets) {
    for (const e of enemies) {
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
        e.hp--; e.flash = 4; b.y = -999;
        if (e.hp <= 0) {
          addKill(e);
          burst(e.x, e.y, e.kind === "crystal" ? C.cyan : C.pink);
          if (Math.random() < (e.kind === "crystal" ? 0.5 : 0.12)) {
            items.push({ x: e.x, y: e.y, kind: Math.random() < 0.85 ? "P" : "L" });
          }
        }
      }
    }
    if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r + 5) {
      boss.hp--; boss.flash = 3; b.y = -999;
      if (boss.hp <= 0) {
        addKill(boss);
        burst(boss.x, boss.y, C.yellow, 60, 6);
        burst(boss.x, boss.y, C.pink, 40, 4);
        popup(boss.x, boss.y - 30, "WAVE CLEAR!", C.mint, 26);
        items.push({ x: boss.x, y: boss.y, kind: "L" });
        boss = null;
        wave++;
        flash = 0.8;
        shake = 14;
        ebullets = [];
      }
    }
  }
  bullets = bullets.filter(b => b.y > -100);

  // 当たり判定: 敵弾・敵 → プレイヤー
  if (player.inv <= 0) {
    let hit = false;
    for (const b of ebullets) if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r) { hit = true; b.y = 9999; break; }
    if (!hit) for (const e of enemies) if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) { hit = true; break; }
    if (!hit && boss && Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r) hit = true;
    if (hit) {
      player.lives--;
      player.inv = 120;
      player.power = Math.max(1, player.power - 1);
      combo = 0; comboTimer = 0;
      burst(player.x, player.y, C.white, 26, 5);
      shake = 12; flash = 0.5;
      ebullets = ebullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 130);
      if (player.lives <= 0) {
        state = STATE.GAMEOVER;
        gameOverTimer = 0;
        if (score > hiScore) { hiScore = score; localStorage.setItem("mgShooterHi", hiScore); }
      }
    }
  }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.8; p.life--; }
  popups = popups.filter(p => p.life > 0);
}

// ---------- 描画ヘルパー ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function drawStar(x, y, r, color, glow = 0) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  starPath(x, y, r);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function heart(x, y, s, color, glow = 0) {
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x + s, y - s * 0.55, x + s * 0.55, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x - s * 0.55, y - s * 1.1, x - s, y - s * 0.55, x, y + s * 0.35);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ---------- 描画 ----------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#1c0b45");
  grad.addColorStop(0.55, "#12082b");
  grad.addColorStop(1, "#0a0420");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 浮遊オーブ（ぼんやりした色の光）
  for (const o of orbs) {
    const x = o.x + Math.sin(frame * o.sp * 60 + o.ph) * 40;
    const y = (o.y + frame * 0.15) % (H + 300) - 150;
    const g = ctx.createRadialGradient(x, y, 0, x, y, o.r);
    const col = o.hue < 0.33 ? "255,82,190" : o.hue < 0.66 ? "77,232,255" : "160,107,255";
    g.addColorStop(0, "rgba(" + col + ",0.10)");
    g.addColorStop(1, "rgba(" + col + ",0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - o.r, y - o.r, o.r * 2, o.r * 2);
  }

  ctx.fillStyle = C.white;
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + s.s * 0.28;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(frame / 4) % 2 === 0) return;
  const { x, y } = player;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(player.tilt);

  // オーラ
  const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
  aura.addColorStop(0, "rgba(255,154,216,0.35)");
  aura.addColorStop(1, "rgba(255,154,216,0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();

  // スカート
  ctx.shadowColor = C.pink; ctx.shadowBlur = 12;
  ctx.fillStyle = C.pink;
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.lineTo(-12, 13);
  ctx.quadraticCurveTo(0, 19, 12, 13);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.pinkHi;
  ctx.beginPath();
  ctx.moveTo(0, -4); ctx.lineTo(-6, 12); ctx.quadraticCurveTo(0, 15, 6, 12);
  ctx.closePath(); ctx.fill();

  // 体・顔
  ctx.fillStyle = C.white;
  rr(-4.5, -9, 9, 9, 3); ctx.fill();
  ctx.fillStyle = "#ffe8d6";
  ctx.beginPath(); ctx.arc(0, -14, 6.5, 0, Math.PI * 2); ctx.fill();

  // 髪（ツインテール）
  ctx.fillStyle = C.purple;
  ctx.beginPath(); ctx.arc(0, -16.5, 7, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-10, -8, 3.4, 9, 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, -8, 3.4, 9, -0.35, 0, Math.PI * 2); ctx.fill();
  // リボン
  ctx.fillStyle = C.yellow;
  starPath(0, -22, 4); ctx.fill();

  // 杖の光
  drawStar(0, -30, 5 + Math.sin(frame * 0.2) * 1.5, C.yellow, 14);

  ctx.restore();

  if (keys["Shift"]) {
    ctx.shadowColor = C.white; ctx.shadowBlur = 8;
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(x, y, player.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 16 + Math.sin(frame * 0.15) * 2, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawEnemy(e) {
  ctx.save();
  const fl = e.flash > 0;
  if (e.kind === "bat") {
    ctx.shadowColor = C.purple; ctx.shadowBlur = 10;
    ctx.fillStyle = fl ? C.white : "#8b3fd6";
    const flap = Math.sin(e.t * 0.3) * 6;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x - 8, e.y); ctx.quadraticCurveTo(e.x - 20, e.y - 10 + flap, e.x - 24, e.y + 2); ctx.quadraticCurveTo(e.x - 16, e.y + 4, e.x - 8, e.y + 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + 8, e.y); ctx.quadraticCurveTo(e.x + 20, e.y - 10 + flap, e.x + 24, e.y + 2); ctx.quadraticCurveTo(e.x + 16, e.y + 4, e.x + 8, e.y + 3); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.arc(e.x - 3, e.y - 1, 1.8, 0, Math.PI * 2); ctx.arc(e.x + 3, e.y - 1, 1.8, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === "ghost") {
    ctx.shadowColor = C.purple; ctx.shadowBlur = 14;
    ctx.fillStyle = fl ? C.white : "rgba(160,107,255,0.92)";
    ctx.beginPath();
    ctx.arc(e.x, e.y - 2, 13, Math.PI, 0);
    const w2 = Math.sin(e.t * 0.2) * 2;
    ctx.lineTo(e.x + 13, e.y + 10);
    for (let i = 3; i >= -3; i--) ctx.lineTo(e.x + i * 4.3, e.y + 10 + (i % 2 === 0 ? 4 + w2 : 0));
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(e.x - 5, e.y - 3, 2.5, 0, Math.PI * 2); ctx.arc(e.x + 5, e.y - 3, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.arc(e.x - 5.8, e.y - 3.8, 0.9, 0, Math.PI * 2); ctx.arc(e.x + 4.2, e.y - 3.8, 0.9, 0, Math.PI * 2); ctx.fill();
  } else if (e.kind === "crystal") {
    ctx.translate(e.x, e.y); ctx.rotate(e.t * 0.03);
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 16;
    ctx.fillStyle = fl ? C.white : C.cyan;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(12, 0); ctx.lineTo(0, 18); ctx.lineTo(-12, 0);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(12, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(b.t * 0.06) * 4);

  const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r * 2);
  aura.addColorStop(0, "rgba(255,82,113,0.22)");
  aura.addColorStop(1, "rgba(255,82,113,0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, b.r * 2, 0, Math.PI * 2); ctx.fill();

  ctx.shadowColor = C.purple; ctx.shadowBlur = 24;
  ctx.fillStyle = b.flash > 0 ? "#ffffff" : "#4318a8";
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#6a1fd0";
  ctx.beginPath(); ctx.moveTo(-32, -22); ctx.lineTo(0, -74); ctx.lineTo(32, -22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.pink;
  rr(-34, -26, 68, 8, 4); ctx.fill();

  const g = Math.sin(b.t * 0.1) * 0.3 + 0.7;
  ctx.globalAlpha = g;
  ctx.shadowColor = C.red; ctx.shadowBlur = 12;
  ctx.fillStyle = C.red;
  ctx.beginPath(); ctx.arc(-15, -5, 6.5, 0, Math.PI * 2); ctx.arc(15, -5, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.strokeStyle = C.red; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 16, 13, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.restore();

  // HPバー（丸型ゲージ）
  const bw = W - 90, bx = 45, by = 58;
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  rr(bx, by, bw, 10, 5); ctx.fill();
  const hpg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hpg.addColorStop(0, C.red);
  hpg.addColorStop(1, C.pink);
  ctx.fillStyle = hpg;
  ctx.shadowColor = C.red; ctx.shadowBlur = 8;
  rr(bx, by, Math.max(10, bw * b.dispHp), 10, 5); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("★ WITCH OF THE VOID ★", W / 2, by - 3);
}

function drawHUD() {
  ctx.textBaseline = "middle";

  // スコアカード（グラス風）
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  rr(12, 12, 168, 44, 14); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 1;
  rr(12, 12, 168, 44, 14); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "bold 10px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("SCORE", 26, 26);
  ctx.fillStyle = C.white;
  ctx.font = "800 22px sans-serif";
  ctx.fillText(Math.round(dispScore).toLocaleString(), 26, 44);

  // ウェーブバッジ
  const wl = "WAVE " + wave;
  ctx.font = "bold 13px sans-serif";
  const wWidth = ctx.measureText(wl).width + 30;
  const wg = ctx.createLinearGradient(W - 12 - wWidth, 0, W - 12, 0);
  wg.addColorStop(0, C.purple);
  wg.addColorStop(1, C.pink);
  ctx.fillStyle = wg;
  ctx.shadowColor = C.pink; ctx.shadowBlur = 10;
  rr(W - 12 - wWidth, 14, wWidth, 28, 14); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.white;
  ctx.textAlign = "center";
  ctx.fillText(wl, W - 12 - wWidth / 2, 29);

  // ライフ（ハート）
  for (let i = 0; i < 5; i++) {
    heart(26 + i * 22, 74, 8, i < player.lives ? C.pink : "rgba(255,255,255,0.12)", i < player.lives ? 8 : 0);
  }

  // パワーゲージ
  for (let i = 0; i < 3; i++) {
    starPath(146 + i * 20, 74, 7);
    ctx.fillStyle = i < player.power ? C.yellow : "rgba(255,255,255,0.12)";
    if (i < player.power) { ctx.shadowColor = C.yellow; ctx.shadowBlur = 8; }
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // コンボ
  if (combo >= 2) {
    const scale = 1 + Math.max(0, comboTimer - 110) * 0.03;
    ctx.save();
    ctx.translate(W - 46, 84);
    ctx.scale(scale, scale);
    ctx.textAlign = "center";
    ctx.font = "900 26px sans-serif";
    ctx.shadowColor = C.yellow; ctx.shadowBlur = 12;
    ctx.fillStyle = C.yellow;
    ctx.fillText(combo + "×", 0, 0);
    ctx.shadowBlur = 0;
    ctx.font = "bold 10px sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText("COMBO", 0, 18);
    ctx.restore();
    // コンボ残量バー
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    rr(W - 76, 100, 60, 4, 2); ctx.fill();
    ctx.fillStyle = C.yellow;
    rr(W - 76, 100, 60 * comboTimer / 120, 4, 2); ctx.fill();
  }
}

function drawGradText(text, x, y, font, c1, c2, glow) {
  ctx.font = font;
  const w = ctx.measureText(text).width;
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.shadowColor = c1; ctx.shadowBlur = glow;
  ctx.fillStyle = g;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}

function drawTitle() {
  // 回転する光条
  ctx.save();
  ctx.translate(W / 2, H / 2 - 180);
  ctx.rotate(frame * 0.004);
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    const g = ctx.createLinearGradient(0, 0, 0, -260);
    g.addColorStop(0, "rgba(255,82,190,0.10)");
    g.addColorStop(1, "rgba(255,82,190,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-24, -260); ctx.lineTo(24, -260);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  const bob = Math.sin(frame * 0.05) * 6;
  drawStar(W / 2, H / 2 - 180 + bob, 44 + Math.sin(frame * 0.05) * 4, C.yellow, 30);
  drawStar(W / 2 - 90, H / 2 - 240 - bob, 12, C.cyan, 14);
  drawStar(W / 2 + 96, H / 2 - 140 + bob * 0.5, 9, C.pink, 12);

  drawGradText("マジカル☆", W / 2, H / 2 - 84, "900 52px sans-serif", C.pink, C.purple, 26);
  drawGradText("シューター", W / 2, H / 2 - 28, "900 52px sans-serif", C.cyan, C.pink, 26);

  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("〜 魔法少女、星降る夜に舞う 〜", W / 2, H / 2 + 18);

  // スタートボタン
  const pulse = 1 + Math.sin(frame * 0.08) * 0.03;
  const bw = 250 * pulse, bh = 58 * pulse;
  const bg = ctx.createLinearGradient(W / 2 - bw / 2, 0, W / 2 + bw / 2, 0);
  bg.addColorStop(0, C.pink);
  bg.addColorStop(1, C.purple);
  ctx.fillStyle = bg;
  ctx.shadowColor = C.pink; ctx.shadowBlur = 24;
  rr(W / 2 - bw / 2, H / 2 + 66 - bh / 2 + 29, bw, bh, bh / 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.white;
  ctx.font = "900 " + Math.round(21 * pulse) + "px sans-serif";
  ctx.fillText("タップでスタート", W / 2, H / 2 + 96);

  // 操作説明カード
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  rr(W / 2 - 170, H / 2 + 150, 340, 92, 16); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1;
  rr(W / 2 - 170, H / 2 + 150, 340, 92, 16); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText("🎮 あそびかた", W / 2, H / 2 + 172);
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "12px sans-serif";
  ctx.fillText("移動: ドラッグ / 矢印キー / WASD ・ 射撃は自動", W / 2, H / 2 + 196);
  ctx.fillText("Shift: 低速移動（当たり判定表示）", W / 2, H / 2 + 218);

  // ハイスコア
  if (hiScore > 0) {
    ctx.fillStyle = C.yellow;
    ctx.shadowColor = C.yellow; ctx.shadowBlur = 8;
    ctx.font = "bold 15px sans-serif";
    ctx.fillText("👑 HI-SCORE  " + hiScore.toLocaleString(), W / 2, H / 2 + 282);
    ctx.shadowBlur = 0;
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(10,4,32,0.82)";
  ctx.fillRect(0, 0, W, H);

  const t = Math.min(1, gameOverTimer / 30);
  const ease = 1 - Math.pow(1 - t, 3);
  ctx.save();
  ctx.translate(0, (1 - ease) * -40);
  ctx.globalAlpha = ease;

  drawGradText("GAME OVER", W / 2, H / 2 - 130, "900 46px sans-serif", C.pink, C.purple, 22);

  // リザルトカード
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  rr(W / 2 - 160, H / 2 - 80, 320, 170, 20); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.13)";
  ctx.lineWidth = 1;
  rr(W / 2 - 160, H / 2 - 80, 320, 170, 20); ctx.stroke();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "bold 11px sans-serif";
  ctx.fillText("SCORE", W / 2, H / 2 - 52);
  ctx.fillStyle = C.white;
  ctx.font = "900 38px sans-serif";
  ctx.fillText(score.toLocaleString(), W / 2, H / 2 - 20);

  ctx.font = "bold 13px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("WAVE " + wave + "　　MAX COMBO " + maxCombo + "×", W / 2, H / 2 + 22);

  if (score >= hiScore && score > 0) {
    ctx.fillStyle = C.yellow;
    ctx.shadowColor = C.yellow; ctx.shadowBlur = 12;
    ctx.font = "900 17px sans-serif";
    ctx.fillText("🎉 NEW RECORD!", W / 2, H / 2 + 60);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText("HI-SCORE " + hiScore.toLocaleString(), W / 2, H / 2 + 60);
  }

  if (gameOverTimer > 50) {
    const pulse = 1 + Math.sin(frame * 0.08) * 0.03;
    const bw2 = 230 * pulse, bh2 = 52 * pulse;
    const bg = ctx.createLinearGradient(W / 2 - bw2 / 2, 0, W / 2 + bw2 / 2, 0);
    bg.addColorStop(0, C.cyan);
    bg.addColorStop(1, C.purple);
    ctx.fillStyle = bg;
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 20;
    rr(W / 2 - bw2 / 2, H / 2 + 130 - bh2 / 2 + 26, bw2, bh2, bh2 / 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.white;
    ctx.font = "900 " + Math.round(18 * pulse) + "px sans-serif";
    ctx.fillText("もういちど あそぶ", W / 2, H / 2 + 156);
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBackground();

  if (state === STATE.TITLE) {
    drawTitle();
    ctx.restore();
    return;
  }

  // 自弾
  for (const b of bullets) drawStar(b.x, b.y, 6.5, "rgba(255,217,77,0.95)", 10);
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();

  // 敵弾
  for (const b of ebullets) {
    ctx.shadowColor = b.color; ctx.shadowBlur = 8;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.42, 0, Math.PI * 2); ctx.fill();
  }

  // アイテム
  for (const it of items) {
    const bob = Math.sin((it.t || 0) * 0.15) * 2;
    const col = it.kind === "P" ? C.yellow : C.mint;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(it.x, it.y + bob, 12, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.ink;
    ctx.font = "900 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(it.kind === "P" ? "P" : "♥", it.x, it.y + bob + 1);
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(it.x, it.y + bob, 15 + Math.sin(frame * 0.2) * 2, 0, Math.PI * 2); ctx.stroke();
  }

  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    if (p.star) {
      drawStar(p.x, p.y, p.size + 1, p.color);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  drawPlayer();

  // スコアポップアップ
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life / 15);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.font = "900 " + p.size + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.text, p.x, p.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if (state === STATE.GAMEOVER) drawGameOver();

  ctx.restore();

  // フラッシュ
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.6, flash) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- ループ ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
